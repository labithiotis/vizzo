post-merge:
  follow: true
  files: git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD
  commands:
    install:
      glob: ['bun.lock', '*package.json']
      run: bun install

pre-commit:
  piped: true
  jobs:
    - name: format
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css}'
      run: bunx --no-install biome check --write --linter-enabled=false --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: check
      run: bun checks

commit-msg:
  commands:
    conventional:
      run: 'grep -Eq "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]+\\))?!?: .+" {1}'
      fail_text: "Use Conventional Commits: type(scope): subject"
